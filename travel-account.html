<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>旅行记账台</title>
<meta name="theme-color" content="#0ea5e9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="记账台">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<!-- FOUC 消除：绘制前确定主题 -->
<script>
(function(){try{var t=localStorage.getItem("wb_travel_theme");if(!t)t=window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";document.documentElement.setAttribute("data-theme",t);var m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute("content",t==="dark"?"#0f172a":"#0ea5e9");}catch(e){}})();
</script>
<style>
  /* ===== 语义令牌（浅色默认） ===== */
  :root{
    --bg:#f1f5f9; --surface:#ffffff; --surface-2:#f8fafc; --surface-3:#f1f5f9;
    --ink-1:#0f172a; --ink-2:#475569; --ink-3:#64748b; --ink-4:#94a3b8;
    --text:var(--ink-1); --muted:var(--ink-3);
    --line:#e2e8f0; --line-2:#eef2f6;
    --primary:#0ea5e9; --primary-dark:#0284c7; --brand-soft:#e0f2fe; --brand-on:#ffffff;
    --exp:#ef4444; --exp-soft:#fef2f2; --exp-line:#fecaca;
    --inc:#22c55e; --inc-soft:#f0fdf4;
    --warn:#f59e0b; --warn-soft:#fff7ed; --warn-line:#fed7aa;
    --tip-bg:#fffbeb; --tip-line:#fde68a; --tip-ink:#92400e;
    --info-soft:#eff6ff; --info-line:#bfdbfe;
    --ring-track:#e2e8f0; --pie-center:#ffffff; --chart-grid:#e2e8f0;
    --radius:14px;
    --shadow:0 1px 3px rgba(15,23,42,.08),0 4px 16px rgba(15,23,42,.05);
    --tabbar-h:60px;
  }
  /* 深色覆写：手动切换与系统跟随各向都生效 */
  @media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --bg:#020617; --surface:#0f172a; --surface-2:#132036; --surface-3:#1e293b;
    --ink-1:#e2e8f0; --ink-2:#cbd5e1; --ink-3:#94a3b8; --ink-4:#64748b;
    --line:#1e293b; --line-2:#273449;
    --primary:#0ea5e9; --primary-dark:#38bdf8; --brand-soft:rgba(14,165,233,.16); --brand-on:#0b1220;
    --exp:#f87171; --exp-soft:rgba(248,113,113,.14); --exp-line:rgba(248,113,113,.35);
    --inc:#4ade80; --inc-soft:rgba(74,222,128,.14);
    --warn:#fbbf24; --warn-soft:rgba(251,191,36,.14); --warn-line:rgba(251,191,36,.35);
    --tip-bg:rgba(251,191,36,.12); --tip-line:rgba(251,191,36,.4); --tip-ink:#fcd34d;
    --info-soft:rgba(14,165,233,.14); --info-line:rgba(14,165,233,.35);
    --ring-track:#1e293b; --pie-center:#0f172a; --chart-grid:#1e293b;
    --shadow:0 1px 0 rgba(0,0,0,.5),0 10px 30px rgba(0,0,0,.45);
  }}
  :root[data-theme="dark"]{
    --bg:#020617; --surface:#0f172a; --surface-2:#132036; --surface-3:#1e293b;
    --ink-1:#e2e8f0; --ink-2:#cbd5e1; --ink-3:#94a3b8; --ink-4:#64748b;
    --line:#1e293b; --line-2:#273449;
    --primary:#0ea5e9; --primary-dark:#38bdf8; --brand-soft:rgba(14,165,233,.16); --brand-on:#0b1220;
    --exp:#f87171; --exp-soft:rgba(248,113,113,.14); --exp-line:rgba(248,113,113,.35);
    --inc:#4ade80; --inc-soft:rgba(74,222,128,.14);
    --warn:#fbbf24; --warn-soft:rgba(251,191,36,.14); --warn-line:rgba(251,191,36,.35);
    --tip-bg:rgba(251,191,36,.12); --tip-line:rgba(251,191,36,.4); --tip-ink:#fcd34d;
    --info-soft:rgba(14,165,233,.14); --info-line:rgba(14,165,233,.35);
    --ring-track:#1e293b; --pie-center:#0f172a; --chart-grid:#1e293b;
    --shadow:0 1px 0 rgba(0,0,0,.5),0 10px 30px rgba(0,0,0,.45);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg);color:var(--text);font-size:15px;line-height:1.5;
    padding-bottom:calc(var(--tabbar-h) + env(safe-area-inset-bottom));
    transition:background-color .25s ease,color .25s ease;
  }
  .wrap{max-width:920px;margin:0 auto;padding:12px 14px;}
  /* 顶栏 */
  .topbar{display:flex;align-items:center;gap:10px;padding:4px 2px 10px;}
  .topbar .brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:17px;}
  .topbar .brand .logo{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--primary),var(--primary-dark));display:flex;align-items:center;justify-content:center;color:#fff;}
  .topbar .brand .logo svg{width:18px;height:18px;}
  .topbar .spacer{flex:1;}
  .icon-btn{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;}
  .icon-btn svg{width:19px;height:19px;}
  .netdot{width:8px;height:8px;border-radius:50%;background:var(--inc);box-shadow:0 0 0 3px var(--inc-soft);}
  .netdot.off{background:var(--muted);box-shadow:0 0 0 3px var(--surface-3);}
  /* 通用卡片 */
  .card{background:var(--surface);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);margin-bottom:14px;transition:background-color .25s ease,border-color .25s ease;}
  .card h2{margin:0 0 12px;font-size:15.5px;display:flex;align-items:center;gap:8px;color:var(--ink-1);}
  .card h2 svg{width:17px;height:17px;color:var(--primary);}
  .card h2 .right{margin-left:auto;font-size:12px;color:var(--muted);font-weight:600;}
  .muted{color:var(--muted);} .small{font-size:12px;}
  .empty{color:var(--muted);font-size:13.5px;text-align:center;padding:18px 8px;line-height:1.7;}
  .row-flex{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  /* 按钮 */
  .btn{display:inline-flex;align-items:center;gap:6px;justify-content:center;min-height:42px;padding:0 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--text);font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;}
  .btn svg{width:17px;height:17px;}
  .btn:active{transform:scale(.97);}
  .btn-primary{background:var(--primary);color:#fff;border-color:transparent;}
  .btn-ghost{background:transparent;border-color:var(--line);color:var(--ink-2);}
  .btn-danger{background:var(--surface);color:var(--exp);border-color:var(--exp-line);}
  .btn-sm{min-height:34px;padding:0 11px;font-size:13px;border-radius:8px;}
  .btn.block{width:100%;}
  /* HERO 概览 */
  .hero{background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;border-radius:18px;padding:18px 16px 16px;box-shadow:var(--shadow);margin-bottom:14px;}
  .hero .trip-line{display:flex;align-items:center;gap:8px;}
  .hero .trip-name{font-size:20px;font-weight:800;letter-spacing:.3px;}
  .hero .trip-dates{font-size:12.5px;opacity:.92;margin-top:3px;}
  .hero .switch-btn{margin-left:auto;background:rgba(255,255,255,.18);border:none;color:#fff;border-radius:9px;padding:7px 11px;font-size:12.5px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:5px;}
  .hero .switch-btn svg{width:15px;height:15px;}
  .hero .ring-area{display:flex;align-items:center;gap:16px;margin-top:14px;flex-wrap:wrap;}
  .ring-wrap{position:relative;width:132px;height:132px;flex:0 0 auto;}
  .ring-wrap .center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;}
  .ring-wrap .center .big{font-size:21px;font-weight:800;line-height:1.1;}
  .ring-wrap .center .lbl{font-size:11px;opacity:.9;margin-top:2px;}
  .hero .stats{flex:1;min-width:150px;display:grid;grid-template-columns:1fr 1fr;gap:9px;}
  .hero .stat{background:rgba(255,255,255,.14);border-radius:11px;padding:9px 11px;backdrop-filter:blur(2px);}
  .hero .stat .v{font-size:16px;font-weight:800;}
  .hero .stat .k{font-size:11px;opacity:.9;}
  .hero .stat.tap{cursor:pointer;}
  .ring-track{stroke:var(--ring-track);}
  .ring-fill{transition:stroke-dasharray .6s cubic-bezier(.4,0,.2,1);}
  .pie-center{fill:var(--pie-center);}
  .chart-grid{stroke:var(--chart-grid);}
  .tool-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;}
  .tool-row .btn{flex:1;min-width:0;background:rgba(255,255,255,.16);color:#fff;border-color:transparent;font-size:12.5px;}
  .tool-row .btn svg{width:15px;height:15px;}
  /* 今天要处理 */
  .today-item{display:flex;align-items:center;gap:10px;padding:10px 11px;border-radius:10px;background:var(--warn-soft);border:1px solid var(--warn-line);margin-bottom:8px;}
  .today-item.overdue{background:var(--exp-soft);border-color:var(--exp-line);}
  .today-item.today{background:var(--info-soft);border-color:var(--info-line);}
  .today-item .t-text{flex:1;font-size:14px;min-width:0;}
  .today-item .t-text b{font-weight:700;}
  .today-item .t-badge{font-size:11px;font-weight:700;padding:2px 7px;border-radius:20px;margin-left:6px;color:#fff;background:var(--warn);}
  .today-item.overdue .t-badge{background:var(--exp);}
  .today-item.today .t-badge{background:var(--primary);}
  .mini-btn{min-height:34px;padding:0 11px;border:none;border-radius:8px;background:var(--primary);color:#fff;font-size:13px;font-weight:600;cursor:pointer;}
  /* 流水 / 记录行 */
  .filter-bar{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap;}
  .search{flex:1;min-width:140px;}
  .chips{display:flex;gap:7px;flex-wrap:wrap;}
  .chip{min-height:32px;padding:0 11px;border-radius:20px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);font-size:12.5px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:5px;}
  .chip.on{background:var(--primary);color:#fff;border-color:transparent;}
  .chip .sw{width:9px;height:9px;border-radius:3px;}
  .day-head{display:flex;align-items:baseline;gap:8px;padding:10px 2px 6px;border-bottom:1px solid var(--line-2);position:sticky;top:0;background:var(--bg);z-index:2;}
  .day-head .d-date{font-size:13px;font-weight:700;color:var(--ink-1);}
  .day-head .d-sub{font-size:12px;color:var(--muted);}
  .day-head .d-no{font-size:12px;color:var(--ink-3);font-style:italic;}
  .rec{display:flex;align-items:center;gap:10px;padding:11px 2px;border-bottom:1px solid var(--line-2);}
  .rec:last-child{border-bottom:none;}
  .rec .ic{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;background:var(--surface-3);}
  .rec .ic svg{width:18px;height:18px;}
  .rec .info{flex:1;min-width:0;}
  .rec .info .t{font-size:14.5px;font-weight:600;}
  .rec .info .s{font-size:12px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .rec .amt{font-size:14.5px;font-weight:700;white-space:nowrap;text-align:right;}
  .rec .amt .orig{display:block;font-size:11.5px;color:var(--muted);font-weight:600;}
  .rec .amt.exp{color:var(--exp);} .rec .amt.inc{color:var(--inc);}
  .rec .acts{display:flex;gap:2px;}
  .del{background:none;border:none;color:var(--muted);cursor:pointer;padding:7px;min-width:34px;min-height:34px;border-radius:8px;}
  .del svg{width:16px;height:16px;}
  .del:active{color:var(--exp);background:var(--exp-soft);}
  .ic-svg{stroke:currentColor;}
  /* 趋势图 */
  .stat-row{display:flex;gap:10px;margin-bottom:12px;}
  .stat-tile{flex:1;background:var(--surface-2);border:1px solid var(--line);border-radius:11px;padding:10px;}
  .stat-tile .v{font-size:16px;font-weight:800;color:var(--ink-1);}
  .stat-tile .k{font-size:11px;color:var(--muted);margin-top:2px;}
  .chart-box{width:100%;overflow-x:auto;}
  .chart-box svg{display:block;width:100%;height:auto;min-width:300px;}
  .bar{cursor:pointer;}
  .bar.hit{fill:transparent;}
  .pie-row{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-top:8px;}
  .leg{display:flex;align-items:center;gap:8px;font-size:13px;padding:3px 0;}
  .leg .sw{width:11px;height:11px;border-radius:3px;flex:0 0 auto;}
  .leg .pc{margin-left:auto;color:var(--muted);font-weight:600;}
  .pie-wrap{width:132px;height:132px;position:relative;flex:0 0 auto;}
  .pie-wrap .pc-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
  .pie-wrap .pc-center .v{font-size:15px;font-weight:800;}
  .pie-wrap .pc-center .k{font-size:10.5px;color:var(--muted);}
  .pie-legend{flex:1;min-width:150px;}
  .field-line{display:flex;align-items:center;gap:8px;margin:10px 0;}
  .field-line label{font-size:12.5px;color:var(--muted);font-weight:600;flex:0 0 auto;}
  /* 待办 */
  .todo{display:flex;align-items:center;gap:10px;padding:11px 2px;border-bottom:1px solid var(--line-2);}
  .todo:last-child{border-bottom:none;}
  .chk{width:24px;height:24px;border-radius:7px;border:2px solid var(--line);flex:0 0 auto;cursor:pointer;display:flex;align-items:center;justify-content:center;background:transparent;color:#fff;}
  .chk.done{background:var(--inc);border-color:var(--inc);}
  .chk svg{width:15px;height:15px;opacity:0;}
  .chk.done svg{opacity:1;}
  .todo .tx{flex:1;font-size:14.5px;}
  .todo.done .tx{text-decoration:line-through;color:var(--muted);}
  .todo .td{font-size:12px;color:var(--muted);}
  .todo .td.over{color:var(--exp);font-weight:600;}
  /* 更多 / 管理列表 */
  .list-row{display:flex;align-items:center;gap:10px;padding:12px 2px;border-bottom:1px solid var(--line-2);}
  .list-row:last-child{border-bottom:none;}
  .list-row .lr-main{flex:1;min-width:0;}
  .list-row .lr-title{font-size:14.5px;font-weight:600;}
  .list-row .lr-sub{font-size:12px;color:var(--muted);margin-top:2px;}
  .mi-block{border:1px solid var(--line);border-radius:12px;margin-bottom:9px;overflow:hidden;}
  .mi-block.open{border-color:var(--primary);}
  .mi-head{display:flex;align-items:center;gap:9px;width:100%;background:none;border:none;cursor:pointer;padding:12px;text-align:left;color:var(--text);font:inherit;}
  .mi-head .chev{transition:transform .2s;color:var(--muted);flex:0 0 auto;}
  .mi-block.open .mi-head .chev{transform:rotate(90deg);color:var(--primary);}
  .mi-detail{padding:0 12px 12px;display:none;}
  .mi-block.open .mi-detail{display:block;}
  .det-sum{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;}
  .det-sum .s{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:5px 9px;font-size:12.5px;}
  .more-item{display:flex;align-items:center;gap:12px;padding:14px 4px;border-bottom:1px solid var(--line-2);cursor:pointer;}
  .more-item:last-child{border-bottom:none;}
  .more-item .mi-ic{width:36px;height:36px;border-radius:10px;background:var(--surface-3);display:flex;align-items:center;justify-content:center;color:var(--primary);flex:0 0 auto;}
  .more-item .mi-ic svg{width:18px;height:18px;}
  .more-item .mi-tx{flex:1;}
  .more-item .mi-tx .t{font-size:14.5px;font-weight:600;}
  .more-item .mi-tx .s{font-size:12px;color:var(--muted);}
  .more-item .arr{color:var(--muted);}
  .ver{font-size:11.5px;color:var(--muted);text-align:center;padding:14px 16px 4px;line-height:1.7;}
  /* 表单元素 */
  input,select,textarea{font-size:16px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--text);width:100%;font-family:inherit;}
  textarea{resize:vertical;min-height:42px;}
  label.fl{font-size:12.5px;color:var(--muted);font-weight:600;display:block;margin-bottom:5px;}
  .field{margin-bottom:11px;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .seg{display:flex;gap:8px;background:var(--surface-3);border-radius:11px;padding:4px;}
  .seg label{flex:1;text-align:center;padding:9px;border-radius:8px;cursor:pointer;font-size:14px;font-weight:600;color:var(--muted);background:transparent;border:none;transition:background .15s,color .15s;}
  .seg input{display:none;}
  .seg input:checked + label.exp{background:var(--exp);color:#fff;}
  .seg input:checked + label.inc{background:var(--inc);color:#fff;}
  .quick-dates{display:flex;gap:7px;margin:4px 0 10px;}
  .qd{flex:1;min-height:34px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);font-size:12.5px;font-weight:600;cursor:pointer;}
  .qd.on{background:var(--brand-soft);color:var(--primary-dark);border-color:var(--primary);}
  .cat-chips{display:flex;gap:7px;flex-wrap:wrap;}
  .cat-chip{min-height:40px;padding:0 11px;border-radius:11px;border:1px solid var(--line);background:var(--surface);cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--ink-2);}
  .cat-chip svg{width:16px;height:16px;}
  .cat-chip.on{color:#fff;border-color:transparent;}
  .conv-line{font-size:12.5px;color:var(--muted);margin:-4px 0 11px;padding:7px 11px;background:var(--surface-2);border-radius:9px;}
  .conv-line b{color:var(--primary-dark);font-weight:700;}
  .member-chips{display:flex;gap:7px;flex-wrap:wrap;}
  .mchip{min-height:34px;padding:0 11px;border-radius:20px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:12.5px;font-weight:600;color:var(--ink-2);display:inline-flex;align-items:center;gap:5px;}
  .mchip.on{background:var(--primary);color:#fff;border-color:transparent;}
  .hint{font-size:11.5px;color:var(--muted);margin-top:6px;}
  /* FAB */
  #fab{position:fixed;right:18px;bottom:calc(var(--tabbar-h) + env(safe-area-inset-bottom) + 14px);width:56px;height:56px;border-radius:50%;border:none;background:var(--primary);color:#fff;font-size:28px;font-weight:300;box-shadow:0 6px 20px rgba(14,165,233,.45);cursor:pointer;z-index:40;display:flex;align-items:center;justify-content:center;transition:transform .15s,background .2s;}
  #fab:active{transform:scale(.92);}
  #fab.hide{display:none;}
  /* 底部 Tab Bar */
  #tabbar{position:fixed;left:0;right:0;bottom:0;height:calc(var(--tabbar-h) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:var(--surface);border-top:1px solid var(--line);display:flex;z-index:35;}
  .tab-btn{flex:1;background:none;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--muted);font-size:11px;font-weight:600;padding-top:7px;}
  .tab-btn svg{width:21px;height:21px;}
  .tab-btn.on{color:var(--primary);}
  .tabviews > section{display:none;}
  .tabviews > section.active{display:block;animation:fadeIn .2s ease;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}
  /* Sheet（底部弹层） */
  .sheet{position:fixed;inset:0;z-index:60;display:none;}
  .sheet.open{display:block;}
  .sheet-mask{position:absolute;inset:0;background:rgba(15,23,42,.45);opacity:0;transition:opacity .25s;}
  .sheet.open .sheet-mask{opacity:1;}
  .sheet-panel{position:absolute;left:0;right:0;bottom:0;background:var(--surface);border-radius:18px 18px 0 0;max-height:92vh;overflow:auto;transform:translateY(100%);transition:transform .28s cubic-bezier(.32,.72,0,1);padding:8px 16px calc(20px + env(safe-area-inset-bottom));}
  .sheet.open .sheet-panel{transform:translateY(0);}
  .sheet-handle{width:38px;height:4px;border-radius:2px;background:var(--line);margin:6px auto 10px;}
  .sheet-title{font-size:17px;font-weight:800;margin:0 0 12px;display:flex;align-items:center;gap:8px;}
  .sheet-title .x{margin-left:auto;background:none;border:none;color:var(--muted);font-size:22px;cursor:pointer;line-height:1;padding:0 4px;}

  .dialog-card p{margin:0 0 14px;font-size:14px;color:var(--muted);}

  .toast{background:rgba(15,23,42,.92);color:#fff;padding:10px 16px;border-radius:11px;font-size:13.5px;font-weight:600;box-shadow:var(--shadow);max-width:90vw;animation:toastIn .25s ease;display:flex;align-items:center;gap:8px;}
  .toast.err{background:var(--exp);}
  .toast.ok{background:var(--inc);color:#fff;}
  @keyframes toastIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
  /* 报表打印 */
  @media print{

  }
  @media(prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important;}}
  @media(max-width:768px){.grid2{grid-template-columns:1fr;}}

<!-- 记一笔 / 编辑 弹层 -->

  </div>
</div>

<!-- 新建旅行 -->

    </div>

      <button type="button" class="btn btn-ghost" data-act="close-sheet" data-target="tripSheet">取消</button>

<!-- 编辑旅行 -->
<div class="sheet" id="tripEditSheet">
  <div class="sheet-mask" data-act="close-sheet" data-target="tripEditSheet"></div>
  <div class="sheet-panel">
    <div class="sheet-handle"></div>
    <h3 class="sheet-title">编辑旅行<button class="x" data-act="close-sheet" data-target="tripEditSheet">×</button></h3>

      <div class="field"><label class="fl">开始日期</label><input type="date" id="teStart"></div>

    </div>

    <div class="sheet-handle"></div>
    <h3 class="sheet-title">成员管理<button class="x" data-act="close-sheet" data-target="memberSheet">×</button></h3>

    </div>
  </div>
</div>

<!-- 汇率表 -->
<div class="sheet" id="rateSheet">
  <div class="sheet-mask" data-act="close-sheet" data-target="rateSheet"></div>
  <div class="sheet-panel">
    <div class="sheet-handle"></div>
    <h3 class="sheet-title">汇率表<button class="x" data-act="close-sheet" data-target="rateSheet">×</button></h3>

  <div class="sheet-mask" data-act="close-sheet" data-target="settleSheet"></div>

    <div class="sheet-handle"></div>

  </div>

<!-- 通用对话框 -->
<div class="dialog" id="dialog">
  <div class="dialog-mask" data-act="dialog-cancel"></div>

      <button class="btn btn-sm btn-primary" data-act="report-print">打印 / PDF</button>
    </div>
    <div id="reportBody"></div>
  </div>
</div>

function tripExpCents(trip){ return (trip.records||[]).filter(function(r){return r.type==="exp";}).reduce(function(a,r){return a+recBaseCents(r);},0); }

}

function splitShares(A, participants, weights){

function updateConv(){
  var t=current(); if(!t) return;
  var amt=parseFloat($("rfAmt").value)||0; var cur=$("rfCur").value; var base=t.baseCurrency;
  var rate = (cur===base)?1:(parseFloat($("rfRate").value)||0);
  $("rateField").style.display = (cur===base)?"none":"block";
  if(cur!==base && !$("rfRate").value){ var def=t.rateTable[cur]||DEFAULT_RATES[cur]; if(def)$("rfRate").value=def; rate=def||0; }
  var bc=Math.round(amt*rate*100);
  var line="折算 ≈ <b>"+fmtBase(bc)+"</b>（"+esc(base)+"）";
  if($("rfCur")&&t.members.length>1){
    var parts=Array.prototype.map.call(document.querySelectorAll("[data-act=split-toggle].on"),function(b){return b.getAttribute("data-mid");});
    var typeEl=document.querySelector('input[name="rtype"]:checked'); var isExp=typeEl?typeEl.value==="exp":true;
    if(isExp && parts.length){ line+=" · 每人 ≈ <b>"+fmtBase(Math.round(bc/parts.length))+"</b>"; }
  }
  $("convLine").innerHTML=line;
}
function gatherRec(){
  var t=current(); var typeEl=document.querySelector('input[name="rtype"]:checked');
  var amt=parseFloat($("rfAmt").value); if(!(amt>0)) return {err:"请输入有效金额"};
  var cur=$("rfCur").value; var base=t.baseCurrency; var rate=(cur===base)?1:(parseFloat($("rfRate").value)||0);
  if(cur!==base && !(rate>0)) return {err:"请输入有效汇率"};
  var date=$("rfDate").value; if(!isDate(date)) return {err:"请选择有效日期"};
  var catEl=document.querySelector("#rfCats .cat-chip.on"); var cat=catEl?catEl.getAttribute("data-cat"):"其他";
  var payer = t.members.length>1 ? ($("rfPayer").value) : t.members[0].id;
  var parts = t.members.length>1 ? Array.prototype.map.call(document.querySelectorAll("[data-act=split-toggle].on"),function(b){return b.getAttribute("data-mid");}) : [t.members[0].id];
  if(!parts.length) parts=[payer];
  var modeEl=document.querySelector('input[name="smode"]:checked'); var mode=modeEl?modeEl.value:"equal";
  var weights=null;
  if(mode==="weighted" && t.members.length>1){ weights={}; var ok=true; document.querySelectorAll("[data-weight]").forEach(function(inp){ var v=parseFloat(inp.value); var mid=inp.getAttribute("data-weight"); if(!(v>0)||parts.indexOf(mid)<0){ /* skip non-selected or invalid */ if(parts.indexOf(mid)>=0 && !(v>0)) ok=false; } else weights[mid]=v; }); if(!ok) return {err:"所选成员的权重需为正数"}; }
  return { rec:{ date:date, type:typeEl?typeEl.value:"exp", amountOriginal:amt, currency:cur, rate:rate, category:cat, note:$("rfNote").value.trim(), payer:payer, split:{mode:mode,participants:parts,weights:weights}, payMethod:$("rfPay").value } };
}

}

function exportCSV(){

function importJSON(){
  var inp=document.createElement("input"); inp.type="file"; inp.accept="application/json,.json";
  inp.onchange=function(e){ var f=e.target.files[0]; if(!f) return; var rd=new FileReader();

  };
  inp.click();
}

function copyReport(){
  var t=current(); if(!t){toast("无数据","err");return;}
  var exp=tripExpCents(t),inc=tripIncCents(t),days=tripDays(t);
  var groups={}; (t.records||[]).filter(function(r){return r.type==="exp";}).forEach(function(r){groups[r.category]=(groups[r.category]||0)+recBaseCents(r);});
  var segs=Object.keys(groups).map(function(k){return k;}).sort(function(a,b){return groups[b]-groups[a];});
  var catTotal=exp||1;
  var s="【"+t.name+"】记账总结\n";
  if(isDate(t.startDate)) s+=t.startDate+(isDate(t.endDate)?(" ~ "+t.endDate):"")+"\n";
  s+="总支出 "+fmtBase(exp)+"｜总收入 "+fmtBase(inc)+(days>0?"｜日均 "+fmtBase(Math.round(exp/days)):"")+"\n";
  if(t.budgetCents>0) s+="预算 "+fmtBase(t.budgetCents)+"｜"+(exp>t.budgetCents?("超支 "+fmtBase(exp-t.budgetCents)):("结余 "+fmtBase(t.budgetCents-exp)))+"\n";
  s+="分类："+segs.map(function(k){return k+" "+Math.round(groups[k]/catTotal*100)+"%";}).join("、");
  copyText(s);
}
function copySettle(){
  var t=current(); if(!t||t.members.length<=1){toast("无需结算","err");return;}
  var pays=settle(computeNet(t));
  var s="【"+t.name+"】结算清单\n"+(pays.length?pays.map(function(p){return memberName(t,p.from)+" → "+memberName(t,p.to)+"："+fmtBase(p.cents);}).join("\n"):"已两清");
  copyText(s);
}
function copyText(s){
  function done(){ toast("已复制到剪贴板","ok"); }
  function fall(){ var ta=document.createElement("textarea"); ta.value=s; ta.style.position="fixed"; ta.style.opacity="0"; document.body.appendChild(ta); ta.select(); try{document.execCommand("copy");done();}catch(e){toast("复制失败","err");} ta.remove(); }
  if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(s).then(done).catch(fall); } else fall();
}
